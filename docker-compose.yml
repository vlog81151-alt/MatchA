services:
  postgres:
    image: postgres:16-alpine
    container_name: matcha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: matcha
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matcha"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - matcha-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: matcha-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - matcha-redis-data:/data

volumes:
  matcha-postgres-data:
  matcha-redis-data:
